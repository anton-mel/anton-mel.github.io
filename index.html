<!doctype html>

<title>Anton Melnychuk</title>
<meta name="description" content="Anton Melnychuk: RTL, physical design, board bring-up and GPU inference systems. Interactive 3D demos of silicon and boards.">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">

<style>
html { height: 100%; }
body.demo { overflow: hidden; height: 100%; }
.stage {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 48%, var(--bg-glow), var(--bg) 72%);
}
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
.stage canvas.is-dragging { cursor: grabbing; }

.panel {
  --tick: var(--ink-3);
  --t: 12px;
  position: fixed;
  z-index: 20;
  top: calc(env(safe-area-inset-top, 0px) + 84px);
  right: max(28px, calc(env(safe-area-inset-right, 0px) + 16px));
  width: min(360px, 30vw);
  max-height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 112px);
  overflow: auto;
  padding: 20px 22px;
  font-family: "Share Tech Mono", var(--font-mono);
  background:
    linear-gradient(var(--tick), var(--tick)) 0 0 / var(--t) 1px no-repeat,
    linear-gradient(var(--tick), var(--tick)) 0 0 / 1px var(--t) no-repeat,
    linear-gradient(var(--tick), var(--tick)) 100% 0 / var(--t) 1px no-repeat,
    linear-gradient(var(--tick), var(--tick)) 100% 0 / 1px var(--t) no-repeat,
    linear-gradient(var(--tick), var(--tick)) 0 100% / var(--t) 1px no-repeat,
    linear-gradient(var(--tick), var(--tick)) 0 100% / 1px var(--t) no-repeat,
    linear-gradient(var(--tick), var(--tick)) 100% 100% / var(--t) 1px no-repeat,
    linear-gradient(var(--tick), var(--tick)) 100% 100% / 1px var(--t) no-repeat;
  scrollbar-width: none;
}
.panel .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line-2); }
.panel .ttl {
  margin: 0;
  font-family: "Chakra Petch", var(--font-display);
  font-weight: 600;
  font-size: 22px;
  line-height: 1;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.panel .tools { display: flex; flex: none; gap: 4px; }
.tr { display: grid; justify-items: end; gap: 8px; }
.navbtn {
  appearance: none;
  position: absolute;
  z-index: 12;
  top: 50%;
  transform: translateY(-50%);
  width: 33px;
  height: 33px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-2);
  border-radius: 0;
  background: rgba(10, 10, 11, 0.6);
  color: var(--ink-2);
  font: 400 14px/1 "Share Tech Mono", var(--font-mono);
  cursor: pointer;
}
.navbtn:hover { color: var(--ink); border-color: var(--ink-3); }
.navbtn.prev { left: max(28px, env(safe-area-inset-left, 0px)); }
.navbtn.next { right: max(28px, env(safe-area-inset-right, 0px)); }
.panel .tools button, a.stars {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 22px;
  border: 1px solid var(--line-2);
  border-radius: 0;
  background: transparent;
  color: var(--ink-2);
  font: 400 12px/1 "Share Tech Mono", var(--font-mono);
  padding: 0 7px;
  cursor: pointer;
  text-decoration: none;
}
.panel .tools button:hover, a.stars:hover { color: var(--ink); border-color: var(--ink-3); }
.stars svg { width: 11px; height: 11px; fill: currentColor; }
.specs { margin: 12px 0 0; padding: 0 0 12px; border-bottom: 1px solid var(--line-2); }
.specs div { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; }
.specs dt {
  flex: none;
  font: 500 10.5px/1.5 "Chakra Petch", var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  white-space: nowrap;
}
.specs i { flex: 1 1 auto; min-width: 14px; border-bottom: 1px dotted var(--line-2); transform: translateY(-3px); }
.specs dd { flex: 0 1 auto; min-width: 0; margin: 0; color: var(--ink); font-size: 13.5px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.specs dd a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--ink-3); }
.specs dd a:hover { border-bottom-color: var(--ink); }
.repo { margin: 12px 0 0; font-size: 12px; letter-spacing: 0.04em; }
.repo a { color: var(--ink-3); text-decoration: none; }
.repo a:hover { color: var(--ink); }
.xview {
  position: absolute;
  z-index: 12;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  transform: translateX(-50%);
  display: flex;
  border: 1px solid var(--line-2);
  background: rgba(10, 10, 11, 0.6);
  font: 400 11px/1 "Share Tech Mono", var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.xview button {
  appearance: none;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--ink-3);
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  padding: 9px 14px;
  cursor: pointer;
}
.xview button { white-space: nowrap; height: 33px; padding: 0 10px; }
.xview button + button { border-left: 1px solid var(--line-2); }
.xview button:hover { color: var(--ink); }
.xview button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.panel .view { animation: rise 0.25s ease-out; }
@keyframes rise { from { opacity: 0.2; transform: translateY(4px); } }
.loading { position: fixed; z-index: 5; left: 0; right: 0; top: 44%; margin: 0; text-align: center; font: 500 11px/1 var(--font-mono); letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-3); pointer-events: none; }

@media (min-width: 761px) {
  .panel, .loading { zoom: 0.72; }
}

@media (max-width: 760px) {
  html, body.demo { height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
  body.demo { display: flex; flex-direction: column; }
  .stage { position: relative; flex: none; height: 56vh; height: 56dvh; min-height: 300px; background: radial-gradient(ellipse 110% 70% at 50% 45%, var(--bg-glow), var(--bg) 72%); }
  .loading { right: 0; top: 26vh; }
  .topbar { align-items: flex-start; }
  .navbtn { width: 33px; height: 33px; font-size: 14px; }
  .navbtn.prev { left: max(12px, env(safe-area-inset-left, 0px)); }
  .navbtn.next { right: max(12px, env(safe-area-inset-right, 0px)); }
  .xview { bottom: 12px; font-size: 11px; letter-spacing: 0.12em; white-space: nowrap; }
  .xview button { height: 33px; padding: 0 10px; }
  .panel {
    position: static;
    flex: 1 1 auto;
    min-height: 0;
    width: auto;
    max-height: none;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    margin: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    padding: 16px 16px 18px;
  }
}
</style>
</head>

<script>
const DEMOS = [

    ],

    ],
    repo: "anton-mel/6502MOS",
    stars: 14,
    palette: {
      mat_30: { c: 0x1c1c1f, m: 0.15, r: 0.6 },
      mat_0: { c: 0x111113, m: 0.05, r: 0.55 },

      mat_2: { c: 0x2a2a2d, m: 0.2, r: 0.5 },
      mat_3: { c: 0xb4b7bc, m: 0.92, r: 0.3 },
      mat_4: { c: 0x18181b, m: 0.05, r: 0.5 },
      mat_5: { c: 0x0e0e10, m: 0.05, r: 0.5 },
      mat_6: { c: 0x7a6852, m: 0.05, r: 0.6 },
      mat_7: { c: 0x76b900, m: 0, r: 0.4, e: 0x5f9400 },
      mat_10: { c: 0xb4b7bc, m: 0.92, r: 0.3 },
      mat_11: { c: 0x141416, m: 0.1, r: 0.5 },
      mat_12: { c: 0xd4ad52, m: 0.95, r: 0.28 },
      mat_13: { c: 0x0c0c0e, m: 0.1, r: 0.45 },
      mat_14: { c: 0x141416, m: 0.08, r: 0.55 },
      mat_15: { c: 0x9fa3a8, m: 0.92, r: 0.3 },
      mat_16: { c: 0x2c2c31, m: 0.1, r: 0.62 },
      mat_17: { c: 0xcaa65a, m: 0.95, r: 0.3 },
      mat_18: { c: 0x76b900, m: 0, r: 0.4, e: 0x76b900 },
      mat_19: { c: 0xd4ad52, m: 0.95, r: 0.3 },
      mat_20: { c: 0x0f1012, m: 0.1, r: 0.5 },
      mat_21: { c: 0x3a3b3e, m: 0.2, r: 0.5 },
      mat_22: { c: 0xb4b7bc, m: 0.92, r: 0.3 },
      mat_23: { c: 0xa9acb1, m: 0.92, r: 0.32 },
      mat_24: { c: 0x26262a, m: 0.1, r: 0.5 },
      mat_25: { c: 0x3a3a3e, m: 0.2, r: 0.5 },
      mat_26: { c: 0x101012, m: 0.1, r: 0.5 },
      mat_27: { c: 0x2a2a2c, m: 0.2, r: 0.6 },
      mat_28: { c: 0x101012, m: 0.1, r: 0.5 }
    }
  }
];

(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const reduceMQ = matchMedia("(prefers-reduced-motion: reduce)");
  const phoneMQ = matchMedia("(max-width: 760px)");
  const STAR = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .7-3.6 3.5.9 5L8 12.2 3.5 14.6l.9-5L.8 6.1l5-.7z"/></svg>';

  const starCache = {};
  function stars(repo) {
    if (starCache[repo]) return starCache[repo];
    let cached = null;
    try { cached = JSON.parse(sessionStorage.getItem(`stars:${repo}`) || "null"); } catch (e) {}
    starCache[repo] = cached !== null ? Promise.resolve(cached) : fetch(`https://api.github.com/repos/${repo}`)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        const n = j && typeof j.stargazers_count === "number" ? j.stargazers_count : null;
        try { if (n !== null) sessionStorage.setItem(`stars:${repo}`, JSON.stringify(n)); } catch (e) {}
        return n;
      })
      .catch(() => null);
    return starCache[repo];
  }

  const state = { active: 0, exploded: false, top: false };
  function renderPanel() {
    const d = DEMOS[state.active];
    $("#panel").innerHTML = `<div class="view">
      <div class="head"><h2 class="ttl">${esc(d.title)}</h2><div class="tools"><a class="stars" href="https://github.com/${d.repo}/stargazers" target="_blank" rel="noopener" aria-label="${d.stars || 0} GitHub stars">${STAR}<span>${(d.stars || 0).toLocaleString()}</span></a></div></div>
      <dl class="specs">${d.specs.map(([k, v]) => `<div><dt>${esc(k)}</dt><i aria-hidden="true"></i><dd title="${esc(v)}">${esc(v)}</dd></div>`).join("")}${d.credits ? `<div><dt>Contributors</dt><i aria-hidden="true"></i><dd>${d.credits.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(n)}</a>`).join(" · ")}</dd></div>` : ""}</dl>
      <p class="repo"><a href="https://github.com/${d.repo}" target="_blank" rel="noopener">github.com/${esc(d.repo)} ↗</a></p>
    </div>`;
    fitSpecs();
    stars(d.repo).then((c) => {
      if (c === null || DEMOS[state.active] !== d) return;
      const st = $("#panel .stars");
      st.querySelector("span").textContent = c.toLocaleString();
      st.setAttribute("aria-label", `${c} GitHub stars`);
    });
  }
  function fitSpecs() {
    document.querySelectorAll("#panel .specs dd").forEach((dd) => {
      dd.style.fontSize = "";
      let fs = parseFloat(getComputedStyle(dd).fontSize);
      while (dd.scrollWidth > dd.clientWidth + 0.5 && fs > 10.5) {
        fs -= 0.5;
        dd.style.fontSize = `${fs}px`;
      }
    });
  }
  window.addEventListener("resize", fitSpecs);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSpecs);
  let scene3d = null;
  function go(i) {
    const n = DEMOS.length;
    state.active = ((i % n) + n) % n;
    renderPanel();
    if (scene3d) scene3d.sync();
  }
  document.querySelectorAll(".navbtn").forEach((b) => b.addEventListener("click", () => go(state.active + Number(b.dataset.step))));
  function renderX() {
    document.querySelectorAll("#xview button").forEach((b) => {
      const on = b.dataset.x === "top" ? state.top : !state.top && (b.dataset.x === "1") === state.exploded;
      b.setAttribute("aria-pressed", String(on));
    });
  }
  function setExplode(on) {
    state.exploded = on;
    state.top = false;
    renderX();
    if (scene3d) scene3d.sync();
  }
  function setTop() {
    state.top = true;
    renderX();
    if (scene3d) scene3d.sync();
  }
  function toggleExplode() {
    setExplode(!state.exploded);
  }
  $("#xview").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-x]");
    if (!b) return;
    if (b.dataset.x === "top") setTop();
    else setExplode(b.dataset.x === "1");
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") go(state.active + 1);
    if (e.key === "ArrowLeft") go(state.active - 1);
  });

  function init3D() {
    const T = window.THREE;
    if (!T || !T.OrbitControls || !T.RoomEnvironment || !T.GLTFLoader) throw new Error("3D library unavailable");
    const probe = document.createElement("canvas");
    if (!(probe.getContext("webgl2") || probe.getContext("webgl"))) throw new Error("WebGL unavailable");
    if (T.ColorManagement) T.ColorManagement.legacyMode = false;

    const stage = $("#stage");
    const canvas = $("#scene");
    const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = T.sRGBEncoding;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = false;
    renderer.setClearColor(0x000000, 0);

    const scene = new T.Scene();
    const pmrem = new T.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new T.RoomEnvironment(), 0.04).texture;
    const camera = new T.PerspectiveCamera(state.top ? 9 : 28, 1, 0.1, 400);

    scene.add(new T.HemisphereLight(0xffffff, 0x0a0a0b, 0.5));
    const key = new T.DirectionalLight(0xffffff, 2.0);
    key.position.set(-6, 16, 8);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 50 });
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = 0.02;
    scene.add(key);
    const rim = new T.DirectionalLight(0xffffff, 0.8);
    rim.position.set(9, 5, -9);
    scene.add(rim);
    const accent = new T.DirectionalLight(0x76b900, 0.75);
    accent.position.set(-10, 3, -6);
    scene.add(accent);
    const ground = new T.Mesh(new T.PlaneGeometry(120, 120), new T.ShadowMaterial({ opacity: 0.5, depthWrite: false }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    ground.receiveShadow = true;
    scene.add(ground);

    const ease = (t) => t * t * (3 - 2 * t);
    const lerp = (a, b, t) => a + (b - a) * t;
    const boxGeo = new T.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);

    function makeItem(def, index) {
      const root = new T.Group();
      const holder = new T.Group();
      root.add(holder);
      root.visible = false;
      scene.add(root);
      return { def, index, root, holder, ready: false, e: 0, te: 0, apply: () => {}, bounds: null };
    }
    function resetRoot(item) {
      item.root.position.set(0, 0, 0);
      item.root.rotation.set(0, 0, 0);
      item.root.scale.setScalar(1);
      item.holder.position.set(0, 0, 0);
      item.root.updateMatrixWorld(true);
    }

    function buildDie(item, data) {
      resetRoot(item);
      const S = 6 / Math.max(data.w, data.h);
      const W2 = data.w / 2;
      const H2 = data.h / 2;
      const raw = {};
      data.layers.forEach((L) => {
        const bin = atob(L.data);
        const buf = new Uint16Array(bin.length / 2);
        for (let i = 0; i < buf.length; i++) buf[i] = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
        raw[L.name] = buf;
      });
      const mat = (color, metal, rough) => new T.MeshStandardMaterial({ color, metalness: metal, roughness: rough, envMapIntensity: metal > 0.5 ? 0.75 : 0.45 });
      const m4 = new T.Matrix4();
      const inst = (names, material, minW) => {
        const total = names.reduce((a, n) => a + (raw[n] ? raw[n].length / 4 : 0), 0);
        const mesh = new T.InstancedMesh(boxGeo, material, total);
        let k = 0;
        names.forEach((n) => {
          const a = raw[n];
          if (!a) return;
          for (let i = 0; i < a.length; i += 4) {
            const w = Math.max((a[i + 2] - a[i]) * S, minW);

          const mk = capH / 100;
          lg.beginPath();
          MARK.forEach(([x, y], n) => (n ? lg.lineTo : lg.moveTo).call(lg, x0 + 58 * mk + x * mk, Hc * 0.22 + y * mk));
          lg.closePath();
          lg.fill();
          lg.textBaseline = "alphabetic";
          lg.font = `600 ${Math.round(capH * 1.32)}px "Chakra Petch", sans-serif`;
          if ("letterSpacing" in lg) lg.letterSpacing = `${Math.round(capH * 0.12)}px`;
          lg.fillText("RESPNS", x0 + 116 * mk + Wc * 0.03, Hc * 0.42);
          lg.font = `400 ${Math.round(Hc * 0.075)}px "Share Tech Mono", monospace`;
          if ("letterSpacing" in lg) lg.letterSpacing = `${Math.round(Hc * 0.012)}px`;
          lg.fillText("CLOSED-LOOP NEUROSTIMULATOR", x0, Hc * 0.6);
          lg.fillText("MODEL RC-1    REV C", x0, Hc * 0.72);
          lg.fillText("SN RC-000127", x0, Hc * 0.84);
          lg.fillRect(x0, Hc * 0.5, Wc * 0.84, Math.max(2, Hc * 0.006));
        };
        paintLid();
        const ltex = new T.CanvasTexture(lc);
        ltex.encoding = T.sRGBEncoding;
        ltex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        const mark = new T.Mesh(new T.PlaneGeometry(PW * S, PD * S).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({ map: ltex, transparent: true, metalness: 0.7, roughness: 0.62, envMapIntensity: 0.6, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }));
        mark.position.set((23 - cx) * S, 6.8 * S + 0.0008, -(14 - cy) * S);
        mark.visible = false;
        groups.can.add(mark);
        canMark = mark;
        if (groups.coil) {
          const onFerrite = mark.clone();
          onFerrite.visible = true;
          onFerrite.position.y = 7.0 * S + 0.0012;
          groups.coil.add(onFerrite);
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
          paintLid();
          ltex.needsUpdate = true;
          dirty = true;
        });
      }
      if (fold && item.def.decals) {
        const tl = new T.TextureLoader();
        const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        const tex = {};
        ["top", "bottom"].forEach((k) => {
          tex[k] = tl.load(item.def.decals[k], () => { dirty = true; });
          tex[k].encoding = T.sRGBEncoding;
          tex[k].anisotropy = aniso;
        });
        const shape = new T.Shape(fold.outline.map(([x, y]) => new T.Vector2(x, y)));
        const base = new T.ShapeGeometry(shape);
        const face = (panel, z, side, back) => {
          const [ru, rv] = fold.uv[panel];
          const src = base.attributes.position;
          const pos = new Float32Array(src.count * 3);
          const uv = new Float32Array(src.count * 2);
          for (let i = 0; i < src.count; i++) {
            const x = src.getX(i);
            const y = src.getY(i);
            pos[i * 3] = (x - cx) * S;
            pos[i * 3 + 1] = z * S;
            pos[i * 3 + 2] = -(y - cy) * S;
            uv[i * 2] = ru[0] * x + ru[1] * y + ru[2];
            uv[i * 2 + 1] = rv[0] * x + rv[1] * y + rv[2];
          }
          const geo = new T.BufferGeometry();
          geo.setAttribute("position", new T.BufferAttribute(pos, 3));
          geo.setAttribute("uv", new T.BufferAttribute(uv, 2));
          geo.setIndex(base.index.clone());
          geo.computeVertexNormals();
          const mat = new T.MeshStandardMaterial({ map: tex[side], transparent: true, roughness: 0.5, metalness: 0.25, envMapIntensity: 0.7, side: back ? T.BackSide : T.FrontSide, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
          const mesh = new T.Mesh(geo, mat);
          mesh.receiveShadow = true;
          groups[panel === "L" ? "lower" : "upper"].add(mesh);
        };
        const t = fold.thickness;
        if (groups.lower) {
          face("L", fold.lower_z + t + 0.005, "top", false);
          face("L", fold.lower_z - 0.005, "bottom", true);
        }
        if (groups.upper) {
          face("U", fold.upper_z - 0.005, "top", true);
          face("U", fold.upper_z + t + 0.005, "bottom", false);
        }
      }
      if (groups.coil) {
        const turns = new T.Group();
        const lineMat = new T.LineBasicMaterial({ color: 0xd39a66, transparent: true, opacity: 0.9 });
        const O = [1.2, 1.2, 44.6, 26.8, 4.8];
        const I = [3.2, 3.2, 42.6, 24.8, 2.8];
        const z = 7.53;
        for (let k = 0; k < 14; k++) {
          const f = (k + 0.5) / 14;
          const [x0, y0, x1, y1, r] = O.map((v, j) => v + (I[j] - v) * f);
          const pts = [];
          const corner = (ccx, ccy, a0) => {
            for (let n = 0; n <= 8; n++) {
              const t = ((a0 + (90 * n) / 8) * Math.PI) / 180;
              pts.push(new T.Vector3((ccx + r * Math.cos(t) - cx) * S, z * S, -(ccy + r * Math.sin(t) - cy) * S));
            }
          };
          corner(x1 - r, y0 + r, -90);
          corner(x1 - r, y1 - r, 0);
          corner(x0 + r, y1 - r, 90);
          corner(x0 + r, y0 + r, 180);
          pts.push(pts[0].clone());
          turns.add(new T.Line(new T.BufferGeometry().setFromPoints(pts), lineMat));
        }
        groups.coil.add(turns);
      }
      const LIFT = 10 * S + 0.35;
      item.holder.position.y = LIFT;
      const off = (g, e) => {
        const o = OFF[g] || [0, 0, 0];
        const k = ease(e);
        return new T.Vector3(o[0] * S * k, o[2] * S * k, -o[1] * S * k);
      };
      item.apply = (e) => {
        Object.keys(groups).forEach((g) => groups[g].position.copy(off(g, e)));
      };
      item.bounds = (e) => {
        const b = new T.Box3();
        Object.keys(boxes).forEach((g) => b.union(boxes[g].clone().translate(off(g, e))));
        b.min.y += LIFT;
        b.max.y += LIFT;
        return b;
      };
      item.setTop = (on) => {
        ["cover", "coil"].forEach((g) => { if (groups[g]) groups[g].visible = !on; });
        if (canMark) canMark.visible = on;
      };
      item.apply(0);
    }

    const items = DEMOS.map(makeItem);
    const loader = new T.GLTFLoader();
    if (T.DRACOLoader) {
      const draco = new T.DRACOLoader();
      draco.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/libs/draco/");
      loader.setDRACOLoader(draco);
    }
    function load(item) {
      if (item.loading) return item.loading;
      item.loading = (item.def.kind === "die"
        ? fetch(item.def.src).then((r) => r.json()).then((data) => buildDie(item, data))
        : item.def.kind === "package"
          ? fetch(item.def.src).then((r) => r.json()).then((data) => buildPackage(item, data))
          : new Promise((res, rej) => loader.load(item.def.src, (g) => res(buildBoard(item, g)), undefined, rej))
      ).then(() => {
        item.ready = true;
        shadowsDirty = true;
        dirty = true;
        layoutNow();
        if (item.index === state.active) {
          $("#loading").hidden = true;
          retarget(true);
        }
      }).catch(() => {
        if (item.index === state.active) $("#loading").textContent = "Could not load this demo";
      });
      return item.loading;
    }

    const SPREAD = 12.5;
    const DEPTH = 1.5;
    const BASE_THETA = 0.42;
    const BASE_PHI = 1.0;
    const RIGHT = new T.Vector3(Math.cos(BASE_THETA), 0, -Math.sin(BASE_THETA));
    const BACK = new T.Vector3(-Math.sin(BASE_THETA), 0, -Math.cos(BASE_THETA));
    let pos = state.active;
    function layoutNow() {
      if (typeof camera !== "undefined" && typeof controls !== "undefined") {
        const th = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
        RIGHT.set(Math.cos(th), 0, -Math.sin(th));
        BACK.set(-Math.sin(th), 0, -Math.cos(th));
      }
      items.forEach((it) => {
        const k = it.index - pos;
        const a = Math.min(Math.abs(k), 1.4);
        it.root.visible = it.ready && Math.abs(k) < 0.999;
        it.root.position.copy(RIGHT).multiplyScalar(k * SPREAD).addScaledVector(BACK, a * DEPTH);
        it.root.rotation.y = 0;
        it.root.scale.setScalar(1 - Math.min(Math.abs(k), 1) * 0.25);
      });
    }

    const controls = new T.OrbitControls(camera, canvas);
    controls.enablePan = false;
    controls.enableDamping = !reduceMQ.matches;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.55;
    controls.zoomSpeed = 0.7;
    controls.minPolarAngle = 0;
    controls.maxPolarAngle = 1.42;

    let W = 1;
    let H = 1;
    let region = { x0: 0, x1: 1, y0: 0, y1: 1 };
    let settle = 0;
    const sph = new T.Spherical();
    const tmpV = new T.Vector3();
    const probeCam = new T.PerspectiveCamera(28, 1, 0.1, 400);

    function fitDistance(box, phi, theta) {
      const rw = region.x1 - region.x0;
      const rh = region.y1 - region.y0;
      const dir = new T.Vector3().setFromSpherical(new T.Spherical(1, phi, theta));
      const c = box.getCenter(new T.Vector3());
      const pts = [];
      [box.min.x, box.max.x].forEach((x) => [box.min.y, box.max.y].forEach((y) => [box.min.z, box.max.z].forEach((z) => pts.push(new T.Vector3(x, y, z)))));
      probeCam.fov = camera.fov;
      probeCam.aspect = W / H;
      probeCam.updateProjectionMatrix();
      const wide = !phoneMQ.matches;
      const fx = wide ? 0.9 : 0.94;
      const ok = (d) => {
        probeCam.position.copy(c).addScaledVector(dir, d);
        probeCam.lookAt(c);
        probeCam.updateMatrixWorld();
        return pts.every((p) => {
          tmpV.copy(p).project(probeCam);
          return Math.abs(tmpV.x) * W / 2 <= rw * 0.5 * fx && Math.abs(tmpV.y) * H / 2 <= rh * 0.5 * 0.92;
        });
      };
      let lo = 2;
      let hi = 200;
      for (let i = 0; i < 22; i++) {
        const mid = (lo + hi) / 2;
        if (ok(mid)) hi = mid;
        else lo = mid;
      }
      return hi;
    }

    function activeBox(e) {
      const it = items[state.active];
      return it.bounds(e);
    }

    function retarget(snap) {
      const it = items[state.active];
      if (!it.ready) return;
      const box = activeBox(it.te);
      const c = box.getCenter(new T.Vector3());
      sph.setFromVector3(tmpV.copy(camera.position).sub(controls.target));
      const phi = snap ? (state.top ? 0.0001 : BASE_PHI) : sph.phi;
      const theta = snap ? (state.top ? 0 : BASE_THETA) : sph.theta;
      const r = fitDistance(box, phi, theta);
      controls.minDistance = r * 0.45;
      controls.maxDistance = r * 1.7;
      if (snap) {
        controls.target.copy(c);
        camera.position.copy(c).add(tmpV.setFromSpherical(new T.Spherical(r, phi, theta)));
        camera.lookAt(c);
        settle = 0;
      } else settle = 1.2;
      dirty = true;
    }

    function relayout() {
      const r = stage.getBoundingClientRect();
      W = Math.max(1, r.width);
      H = Math.max(1, r.height);
      renderer.setSize(W, H, false);
      camera.aspect = W / H;
      const tb = document.querySelector(".topbar").getBoundingClientRect().bottom;
      if (phoneMQ.matches) region = { x0: 0, x1: W, y0: Math.max(0, tb - r.top) + 4, y1: H - 56 };
      else {
        const pr = $("#panel").getBoundingClientRect();
        const half = Math.max(160, Math.min(W / 2 - 16, pr.left - 24 - W / 2));
        region = { x0: W / 2 - half, x1: W / 2 + half, y0: tb + 4, y1: H - 70 };
      }
      const cx = (region.x0 + region.x1) / 2;
      const cy = (region.y0 + region.y1) / 2;
      camera.setViewOffset(W, H, W / 2 - cx, H / 2 - cy, W, H);
      camera.updateProjectionMatrix();
      retarget(false);
      dirty = true;
    }


    let interacting = false;
    let aim = null;
    let spin = 0;
    const SPIN = (Math.PI * 2) / 60;
    let lastUser = -1e9;
    controls.addEventListener("start", () => {
      interacting = true;
      settle = 0;
      canvas.classList.add("is-dragging");
    });
    controls.addEventListener("end", () => {
      interacting = false;
      lastUser = performance.now();
      canvas.classList.remove("is-dragging");
    });
    controls.addEventListener("change", () => { dirty = true; });

    const ray = new T.Raycaster();
    const ndc = new T.Vector2();
    let down = null;
    canvas.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
    canvas.addEventListener("pointerup", (e) => {
      if (!down) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      const quick = performance.now() - down.t < 600;
      down = null;
      if (moved > 7 || !quick) return;
      const r = canvas.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const act = items[state.active];
      if (act.ready && !state.top) {
        act.root.updateMatrixWorld(true);
        if (ray.ray.intersectsBox(act.bounds(act.e).applyMatrix4(act.root.matrixWorld))) {
          toggleExplode();
          return;
        }
      }
      for (const it of items) {
        if (it.index === state.active || !it.root.visible || !it.bounds) continue;
        it.root.updateMatrixWorld(true);
        if (ray.ray.intersectsBox(it.bounds(it.e).applyMatrix4(it.root.matrixWorld))) {
          go(it.index);
          return;
        }
      }
    });

    let dirty = true;
    let shadowsDirty = true;
    let raf = 0;
    let last = 0;
    function frame(now) {
      raf = requestAnimationFrame(frame);
      const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
      last = now;
      let moving = false;
      const reduce = reduceMQ.matches;
      const goal = state.active;
      if (pos !== goal) {
        pos = reduce ? goal : pos + (goal - pos) * Math.min(1, dt * 5);
        if (Math.abs(pos - goal) <= 0.0005) pos = goal;
        layoutNow();
        moving = true;
        shadowsDirty = true;
      }
      items.forEach((it) => {
        if (!it.ready) return;
        if (it.setTop && it.topOn !== state.top) {
          it.setTop(state.top);
          it.topOn = state.top;
          shadowsDirty = true;
          moving = true;
        }
        it.te = it.index === goal && state.exploded && !state.top && Math.abs(pos - goal) < 0.15 ? 1 : 0;
        if (it.e !== it.te) {
          const step = dt * 0.9;
          it.e = reduce ? it.te : it.te > it.e ? Math.min(it.te, it.e + step) : Math.max(it.te, it.e - step * 1.4);
          it.apply(it.e);
          moving = true;
          shadowsDirty = true;
          if (it.index === goal) settle = Math.max(settle, 0.4);
        }
      });
      const act = items[goal];
      const fovGoal = state.top ? 9 : 28;
      if (Math.abs(camera.fov - fovGoal) > 0.01) {
        camera.fov = reduce ? fovGoal : lerp(camera.fov, fovGoal, Math.min(1, dt * 4));
        if (Math.abs(camera.fov - fovGoal) <= 0.01) camera.fov = fovGoal;
        camera.updateProjectionMatrix();
        settle = Math.max(settle, 0.2);
        moving = true;
      }
      if (settle > 0 && act.ready) {
        const box = activeBox(act.e);
        const c = box.getCenter(new T.Vector3());
        sph.setFromVector3(tmpV.copy(camera.position).sub(controls.target));
        if (aim) {
          const ka = reduce ? 1 : Math.min(1, dt * 4);
          sph.phi = lerp(sph.phi, aim.phi, ka);
          sph.theta = lerp(sph.theta, aim.theta, ka);
          if (Math.abs(sph.phi - aim.phi) < 0.002 && Math.abs(sph.theta - aim.theta) < 0.002) aim = null;
          else settle = Math.max(settle, 0.1);
        }
        const r = fitDistance(box, sph.phi, sph.theta);
        controls.minDistance = r * 0.45;
        controls.maxDistance = r * 1.7;
        const k = reduce ? 1 : Math.min(1, dt * 4);
        controls.target.lerp(c, k);
        sph.radius = lerp(sph.radius, r, k);
        camera.position.copy(controls.target).add(tmpV.setFromSpherical(sph));
        settle -= dt;
        moving = true;
      }
      if (!interacting && !reduce && !state.top && !aim && act.ready && now - lastUser > 2500) {
        sph.setFromVector3(tmpV.copy(camera.position).sub(controls.target));
        spin = Math.min(1, spin + dt * 0.5);
        sph.theta += dt * SPIN * spin;
        camera.position.copy(controls.target).add(tmpV.setFromSpherical(sph));
        moving = true;
      } else spin = 0;
      moving = controls.update() || moving;
      if (moving || dirty) {
        if (shadowsDirty) {
          renderer.shadowMap.needsUpdate = true;
          shadowsDirty = false;
        }
        renderer.render(scene, camera);
        dirty = false;
      }
    }
    function start() {
      if (raf) return;
      last = 0;
      relayout();
      raf = requestAnimationFrame(frame);
    }
    function stop() {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
    }
    window.addEventListener("resize", relayout);
    document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
    phoneMQ.addEventListener && phoneMQ.addEventListener("change", relayout);

    let wasTop = state.top;
    controls.enableRotate = !state.top;
    layoutNow();
    load(items[state.active]).then(() => items.forEach(load));

    return {
      start,
      sync() {
        lastUser = -1e9;
        controls.enableRotate = !state.top;
        aim = state.top ? { phi: 0.0001, theta: 0 } : wasTop ? { phi: BASE_PHI, theta: BASE_THETA } : null;
        wasTop = state.top;
        settle = Math.max(settle, 1.5);
        if (!items[state.active].ready) {
          $("#loading").hidden = false;
          $("#loading").textContent = "Loading";
          load(items[state.active]);
        } else {
          $("#loading").hidden = true;
          retarget(false);
        }
        dirty = true;
      }
    };
  }

  renderPanel();
  renderX();
  try {
    scene3d = init3D();
    scene3d.start();
  } catch (err) {
    $("#loading").hidden = true;
    $("#loading").hidden = false;
    $("#loading").innerHTML = `3D needs WebGL · <a href="resume.html">résumé</a>`;
  }
})();
</script>
</body>
</html>
